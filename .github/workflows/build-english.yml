      - name: Translate and rebrand
        shell: pwsh
        run: |
          python patch_english.py .
          if ($LASTEXITCODE -ne 0) { throw 'Patch did not apply. Build stopped.' }

      - name: Build Windows executable
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw 'Rust compilation failed.' }

      - name: Package exe and GPL source
        shell: pwsh
        run: |
          New-Item -Path 'output' -ItemType Directory -Force | Out-Null
          Copy-Item 'target/release/replay-lite-en.exe' 'output/ReplayLiteEN.exe' -ErrorAction Stop
          Compress-Archive -Path src,Cargo.toml,Cargo.lock,build.rs,LICENSE,README.md,patch_english.py,english_strings.json,icon_draw_replay.rs,LICENSE-NOTICE.txt -DestinationPath 'output/ReplayLiteEN-source.zip' -CompressionLevel Optimal

      - name: Downloadable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ReplayLiteEN-Windows
          path: output/*
          if-no-files-found: error
