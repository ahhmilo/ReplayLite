name: Build Replay Lite EN (no developer tools needed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Always build against the public original v0.3.4 source, not fork changes.
      - name: Check out original Clippy 0.3.4 source
        uses: actions/checkout@v4
        with:
          repository: santiremedi/clippy
          ref: v0.3.4
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

